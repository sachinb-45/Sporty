<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPORTY - Contact & Registration</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-top">
    <h1>Sporty</h1>

    <div class="navbar-links">
      <p class="navbar-link"><a href="index.html">Home</a></p>
      <p class="navbar-link"><a href="collection.html">Products</a></p>
      <p class="navbar-link"><a href="contact.html">Contact</a></p>
      <p class="navbar-link" id="login-link"><a href="login.html">Login</a></p>
    </div>
  </div>

  <div class="navbar-user-row" id="user-section"></div>
</nav>

<!-- CONTACT + REGISTRATION -->
<div class="contact-registration">
    <div class="contact-box">
        <h2 class="headingText">Contact Us</h2>
        <p>Email: support@sporty.com</p>
        <p>Phone: +91 98765 43210</p>
        <p>Address: 123, Sports Street, Chennai, India</p>
    </div>

    <div class="registration-box">
        <h2 class="headingText">User Registration</h2>

        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

            <button type="submit">Register</button>

            <p id="responseMessage" style="margin-top:10px; font-weight:bold;"></p>
        </form>
    </div>
</div>

<!-- FOOTER -->
<div class="footer">
    <div class="footer-container">
        <div class="footer-box-1">
            <h2 class="headingText">Sporty</h2>
            <p>© 2025 Sports Hub. All rights reserved.</p>
        </div>
    </div>
    <p>@Sporty.com</p>
</div>

<!-- USER LOGIN / LOGOUT -->
<script>
const userSection = document.getElementById("user-section");
const loginLink = document.getElementById("login-link");
const user = JSON.parse(localStorage.getItem("user"));

if (user) {
  const firstLetter = user.name.charAt(0).toUpperCase();

  userSection.innerHTML = `
    <div class="user-avatar">${firstLetter}</div>
    <span>${user.name}</span>
    <span class="logout-link" id="logoutBtn">Logout</span>
  `;

  loginLink.style.display = "none";

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("user");
    window.location.href = "login.html";
  });
}
</script>

<!-- REGISTRATION SCRIPT -->
<script>
const form = document.getElementById("registerForm");
const msg = document.getElementById("responseMessage");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    msg.innerText = "";

    if (!name || !email || !password || !confirmPassword) {
        msg.style.color = "red";
        msg.innerText = "All fields are required!";
        return;
    }

    if (password !== confirmPassword) {
        msg.style.color = "red";
        msg.innerText = "Passwords do not match!";
        return;
    }

    try {
        const response = await fetch("http://localhost:5000/api/users/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
            msg.style.color = "red";
            msg.innerText = data.message || "Registration failed";
        } else {
            msg.style.color = "green";
            msg.innerText = "Registration successful! ✔";
            form.reset();
        }

    } catch (error) {
        msg.style.color = "red";
        msg.innerText = "Backend not reachable. Please try again.";
    }
});
</script>

</body>
</html>
