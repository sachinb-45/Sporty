<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sporty - Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <h1>Sporty</h1>
    <div class="navbar-links">
        <p class="navbar-link"><a href="index.html">Home</a></p>
        <p class="navbar-link"><a href="collection.html">Products</a></p>
        <p class="navbar-link"><a href="contact.html">Contact</a></p>
        <p class="navbar-link"><a href="login.html">Login</a></p>
    </div>
</nav>

<div class="login-container">
    <form class="login-box" id="loginForm">
        <h2>Login</h2>

        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <p id="loginMessage" style="margin-top:10px; font-weight:600;"></p>
        <p class="login-footer">Don’t have an account? <a href="contact.html">Sign Up</a></p>
    </form>
</div>

<script>
const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");

loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    try {
        const response = await fetch("http://localhost:5000/api/users/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
            loginMessage.style.color = "red";
            loginMessage.innerText = data.message;
        } else {
            loginMessage.style.color = "green";
            loginMessage.innerText = "Login Successful ✔";

            localStorage.setItem("user", JSON.stringify(data.user));

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1000);
        }

    } catch (err) {
        loginMessage.style.color = "red";
        loginMessage.innerText = "Server error! Check backend.";
    }
});
</script>

</body>
</html>
