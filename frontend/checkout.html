<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sporty - Checkout</title>

  <style>
    body {
      background: linear-gradient(135deg, #eef2f7, #dbe5ef);
      font-family: "Poppins", sans-serif;
      margin: 0;
    }

    /* NAVBAR */
    .navbar {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      padding: 18px 40px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .navbar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar a {
      text-decoration: none;
      margin-left: 22px;
      color: #10232C;
      font-weight: 600;
    }

    /* USER ROW */
    .navbar-user-row {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #10232C;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .logout-link {
      color: red;
      cursor: pointer;
      font-size: 14px;
    }

    /* PAGE CONTENT */
    .checkout-wrapper {
      max-width: 950px;
      margin: 50px auto;
      padding: 25px;
    }

    .checkout-title {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 30px;
      font-weight: 700;
      color: #10232C;
    }

    .order-summary-container {
      background: rgba(255,255,255,0.85);
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .summary-title {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 18px;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 10px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
    }

    .summary-total {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: right;
      margin-top: 18px;
    }

    .checkout-form {
      background: rgba(255,255,255,0.9);
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    }

    .checkout-form input,
    .checkout-form textarea,
    .checkout-form select {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 1px solid #c5cdd6;
      border-radius: 10px;
    }

    .place-order-btn {
      margin-top: 30px;
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #10232C, #1d6fa5);
      color: white;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
    }

    .success-message {
      text-align: center;
      margin-top: 20px;
      font-weight: 600;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-top">
    <h2>Sporty</h2>
    <div>
      <a href="index.html">Home</a>
      <a href="collection.html">Products</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      <a href="login.html" id="login-link">Login</a>
    </div>
  </div>

  <!-- USER INFO ROW -->
  <div class="navbar-user-row" id="user-section"></div>
</nav>

<!-- CHECKOUT CONTENT -->
<div class="checkout-wrapper">
  <h1 class="checkout-title">Checkout</h1>

  <div id="order-summary" class="order-summary-container"></div>

  <form id="checkoutForm" class="checkout-form">
    <input type="text" id="customerName" placeholder="Full Name" required />
    <input type="email" id="customerEmail" placeholder="Email Address" required />
    <input type="tel" id="customerPhone" placeholder="Phone Number" required />
    <textarea id="address" placeholder="Delivery Address" rows="4" required></textarea>

    <label>Payment Method</label>
    <select id="paymentMethod">
      <option value="COD">Cash on Delivery</option>
      <option value="Online">Online Payment</option>
    </select>

    <button type="submit" class="place-order-btn">Place Your Order</button>
  </form>

  <p id="orderMessage" class="success-message"></p>
</div>

<script>
/* CART COUNT */
function getCart() {
  return JSON.parse(localStorage.getItem("cart") || "[]");
}
document.getElementById("cart-count").innerText = getCart().length;

/* USER NAVBAR LOGIC */
const user = JSON.parse(localStorage.getItem("user"));
const userSection = document.getElementById("user-section");
const loginLink = document.getElementById("login-link");

if (user) {
  const letter = user.name.charAt(0).toUpperCase();

  userSection.innerHTML = `
    <div class="user-avatar">${letter}</div>
    <span>${user.name}</span>
    <span class="logout-link" id="logoutBtn">Logout</span>
  `;

  loginLink.style.display = "none";

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("user");
    window.location.href = "login.html";
  });
}

/* CHECK EMPTY CART */
const cart = getCart();
if (cart.length === 0) {
  alert("Your cart is empty.");
  window.location.href = "cart.html";
}

/* ORDER SUMMARY */
function renderSummary() {
  const summary = document.getElementById("order-summary");
  let total = 0;
  let html = `<h2 class="summary-title">Order Summary</h2>`;

  cart.forEach(item => {
    total += item.price * item.quantity;
    html += `
      <div class="summary-item">
        <span>${item.name} × ${item.quantity}</span>
        <span>₹${item.price * item.quantity}</span>
      </div>
    `;
  });

  html += `<div class="summary-total">Total: ₹${total}</div>`;
  summary.innerHTML = html;
}
renderSummary();

/* PLACE ORDER */
document.getElementById("checkoutForm").addEventListener("submit", async e => {
  e.preventDefault();

  const order = {
    items: cart,
    customerName: customerName.value,
    customerEmail: customerEmail.value,
    customerPhone: customerPhone.value,
    address: address.value,
    paymentMethod: paymentMethod.value,
    totalAmount: cart.reduce((s, i) => s + i.price * i.quantity, 0)
  };

  const res = await fetch("http://localhost:5000/api/orders", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(order)
  });

  const data = await res.json();

  if (!data.error) {
    orderMessage.innerText = "Order placed successfully!";
    localStorage.removeItem("cart");
    setTimeout(() => window.location.href = "index.html", 3000);
  } else {
    orderMessage.style.color = "red";
    orderMessage.innerText = data.error;
  }
});
</script>

</body>
</html>
